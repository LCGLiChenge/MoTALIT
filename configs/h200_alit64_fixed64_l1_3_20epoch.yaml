# Paths that vary by server are passed explicitly on the torchrun command line.
output_dir: results/alit64_vqgan_mix_fixed64_l1_3_h200_20epoch
alit_root: third_party/alit
resume: ''
reset_optimizer: false
image_size: 256

# Fallback only. The first H200 run probes and overrides the largest safe batch.
batch_size: 24
accum_steps: 1
epochs: 20
max_steps: 0
num_workers: 8
limit_samples: 0
random_crop: false
random_flip: false
mixed_precision: bf16
seed: 0

# Official ALIT-64 plus exactly 64 Router-selected native VQGAN grids.
alit_tokens: 64
refine_tokens: 64
native_decode_chunk: 4
router_hidden_dim: 128
router_depth: 3
router_detach_inputs: true
router_tau: 0.7

lr: 1.0e-6
lr_vqgan_encoder: 2.0e-7
lr_vqgan_decoder: 8.0e-7
lr_router: 1.0e-5
lr_d: 5.0e-5
min_lr: 0.0
warmup_steps: 0
weight_decay: 0.01
max_grad_norm: 1.0
ema_decay: 0.999

# L1 rises from 2.0 to 3.0. LPIPS retains its old effective 2.0 x 0.3 = 0.6.
perceptual_loss: lpips
lambda_perceptual: 0.3
lambda_lpips: 0.3
lambda_mix: 2.0
lambda_l1: 3.0
lambda_dino_feat: 0.5
lambda_clip_feat: 0.5
lambda_alit_quant: 0.0
lambda_router_aux: 1.0
lambda_router_budget: 20.0
lambda_router_binary: 0.01
lambda_disc_feature_matching: 0.5
lambda_gan: 0.12

router_only_epochs: 0.5
gan_start_epoch: 1.5
d_warmup_epochs: 0.01
d_every: 1
lecam_regularization_weight: 0.001
lecam_ema_decay: 0.999

projected_input_size: 224
projected_head_hidden: 512
projected_head_depth: 4
projected_backbone: convnext_base
projected_loss_weights: [1.0, 1.0, 1.0, 1.0]
projected_pretrained: true

dino_repo: third_party/dinov2
dino_model: dinov2_vits14
dino_input_size: 224
dino_feat_input_size: 224
dino_feat_use_patch_tokens: true
dino_feat_loss: l1
dino_feat_normalize: true

clip_model: ViT-B-32
clip_pretrained: openai
clip_cache_dir: weights/open_clip
clip_prefer_hf_hub: false
clip_weights_only: false
clip_feat_input_size: 224
clip_feat_loss: l1
clip_feat_normalize: true
llamagen_root: third_party/llamagen

# latest.pt is refreshed every epoch; only epochs 10 and 20 get numbered snapshots.
latest_every: 0
save_epoch_every: 10
log_every: 50
wandb: true
wandb_project: MoT
wandb_name: alit64_fixed64_l1_3_h200_20epoch
